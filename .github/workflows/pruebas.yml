name: Pruebas automáticas

# Se ejecuta en cada push y en cada pull request: valida el motor contable
# completo (275 pruebas, incluido el banco de casos prácticos §61 y las reglas §62) y comprueba
# que el servidor de producción arranca, genera la base de demostración y responde en Linux.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Suite de pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar la suite de pruebas
        run: python -m pytest tests -q

      - name: Resumen
        if: always()
        run: echo "Suite del Simulador Integral de Sistema Contable finalizada."

  despliegue:
    name: Arranque del servidor de producción
    runs-on: ubuntu-latest
    needs: pruebas

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Arrancar el servidor y verificar el despliegue
        env:
          HOST: 127.0.0.1
          PORT: "8080"
          DATABASE_PATH: /tmp/simulador/simulator.db
          SECRET_KEY: clave-de-integracion-continua
        run: |
          mkdir -p /tmp/simulador
          nohup python serve.py > /tmp/simulador/servidor.log 2>&1 &
          for intento in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "Servidor listo tras ~$((intento * 4))s"
              break
            fi
            sleep 4
          done
          cat /tmp/simulador/servidor.log
          python deploy/verificar_despliegue.py --url http://127.0.0.1:8080
