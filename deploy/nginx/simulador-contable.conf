# Proxy inverso para el Simulador Integral de Sistema Contable (VPS con dominio).
#
# OJO: este archivo es una PLANTILLA. El dominio NO está fijado en ningún sitio:
# la cadena __DOMINIO__ se sustituye al instalar (deploy/hostinger/instalar_vps.sh --dominio TU-DOMINIO)
# o con:  sed "s/__DOMINIO__/tu.dominio.com/g" simulador-contable.conf
#
# 1) Copiar a /etc/nginx/sites-available/simulador-contable
# 2) ln -s /etc/nginx/sites-available/simulador-contable /etc/nginx/sites-enabled/
# 3) nginx -t && systemctl reload nginx
# 4) HTTPS:  certbot --nginx -d TU-DOMINIO
#    (certbot agrega el bloque 443 y la redirección desde HTTP automáticamente)

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    # Archivos del manual y respaldos no se exponen: solo la aplicación.
    client_max_body_size 16m;
    access_log /var/log/nginx/simulador-access.log;
    error_log  /var/log/nginx/simulador-error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        expires 7d;
        access_log off;
    }
}
